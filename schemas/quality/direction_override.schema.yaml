schema_id: "direction_override.schema"
schema_version: "0.1.0"
object_type: "direction_override"
title: "Direction Override Schema"
description: "Expert override of an agent route or loop decision."

required_fields:
  - schema_version
  - object_type
  - object_id
  - object_version
  - created_at
  - updated_at
  - status
  - metadata
  - topic_id
  - task_id
  - created_by
  - source
  - target_refs
  - evidence_refs
  - source_routing_ref
  - override_action
  - why_agent_route_is_insufficient
  - new_constraints
  - must_not_do

field_specs:
  schema_version:
    type: string
  object_type:
    type: enum
    allowed: ["direction_override"]
  object_id:
    type: string
  object_version:
    type: string
  created_at:
    type: datetime
  updated_at:
    type: datetime
  status:
    type: enum
    allowed: ["draft", "active", "superseded", "resolved", "rejected"]
  metadata:
    type: object
  topic_id:
    type: string
  task_id:
    type: string
  created_by:
    type: string
  source:
    type: enum
    allowed: ["ui", "cli", "api", "agent_suggestion"]
  target_refs:
    type: array[string]
  evidence_refs:
    type: array[string]
  source_routing_ref:
    type: string
  override_action:
    type: string
  why_agent_route_is_insufficient:
    type: string
  new_constraints:
    type: array[string]
  must_not_do:
    type: array[string]
