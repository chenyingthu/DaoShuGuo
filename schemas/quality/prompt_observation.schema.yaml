schema_id: "prompt_observation.schema"
schema_version: "0.1.0"
object_type: "prompt_observation"
title: "Prompt Observation Schema"
description: "Prompt/约束效果观察对象。用于记录某条提示、约束或 harness 对 Agent 行为的影响。"

required_fields:
  - schema_version
  - object_type
  - object_id
  - object_version
  - created_at
  - updated_at
  - status
  - metadata
  - task_ref
  - run_ref
  - observation_kind
  - statement

field_specs:
  schema_version:
    type: string
  object_type:
    type: enum
    allowed: ["prompt_observation"]
  object_id:
    type: string
    pattern_hint: "prompt_observation.<domain>.<problem_name>.<serial>"
    example: "prompt_observation.power.ieee33_reactive_opt.0001"
  object_version:
    type: string
    pattern_hint: "major.minor.patch"
  created_at:
    type: datetime
  updated_at:
    type: datetime
  status:
    type: enum
    allowed: ["draft", "active", "archived"]
  metadata:
    type: object
    required: true
  title:
    type: string
    required: false
  description:
    type: string
    required: false
  tags:
    type: array[string]
    required: false
  extensions:
    type: object
    required: false
  experimental:
    type: object
    required: false
  task_ref:
    type: string
  run_ref:
    type: string
  source_trace_ref:
    type: string
    required: false
  observation_kind:
    type: enum
    allowed: ["helpful_constraint", "ignored_constraint", "hallucination_risk", "quality_improvement", "process_drift"]
  statement:
    type: string
  severity:
    type: enum
    allowed: ["low", "medium", "high"]
    required: false
  evidence_excerpt:
    type: string
    required: false
  suggested_action:
    type: string
    required: false

validation_rules:
  - rule_id: "prompt-observation-run-required"
    description: "没有 run_ref 的 prompt_observation 不成立。"
  - rule_id: "prompt-observation-statement-required"
    description: "statement 不能为空。"

authoring_notes:
  - "Prompt Observation 面向方法论研究，不是任务事实本身。"
  - "它记录的是约束效果，而不是结果优劣。"
