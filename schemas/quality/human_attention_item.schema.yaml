schema_id: "human_attention_item.schema"
schema_version: "0.1.0"
object_type: "human_attention_item"
title: "Human Attention Item Schema"
description: "Question or decision point requiring expert attention."

required_fields:
  - schema_version
  - object_type
  - object_id
  - object_version
  - created_at
  - updated_at
  - status
  - metadata
  - topic_id
  - severity
  - stage
  - question
  - why_human_needed
  - agent_recommendation
  - evidence_refs
  - allowed_actions
  - writeback_object_type

field_specs:
  schema_version:
    type: string
  object_type:
    type: enum
    allowed: ["human_attention_item"]
  object_id:
    type: string
  object_version:
    type: string
  created_at:
    type: datetime
  updated_at:
    type: datetime
  status:
    type: enum
    allowed: ["open", "resolved", "superseded", "archived"]
  metadata:
    type: object
  topic_id:
    type: string
  severity:
    type: enum
    allowed: ["low", "medium", "high", "blocking"]
  stage:
    type: enum
    allowed: ["literature", "framing", "skill", "evaluation", "cognition", "delivery"]
  question:
    type: string
  why_human_needed:
    type: string
  agent_recommendation:
    type: string
  evidence_refs:
    type: array[string]
  allowed_actions:
    type: array[string]
  writeback_object_type:
    type: string
