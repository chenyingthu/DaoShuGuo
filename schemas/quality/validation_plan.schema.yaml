schema_id: "validation_plan.schema"
schema_version: "0.1.0"
object_type: "validation_plan"
title: "Validation Plan Schema"
description: "用于表达某条研究主线的验证覆盖与缺口。"
required_fields:
  - schema_version
  - object_type
  - object_id
  - created_at
  - status
  - task_ref
  - covered_dimensions
  - missing_dimensions
  - summary
field_specs:
  schema_version:
    type: string
  object_type:
    type: enum
    allowed: ["validation_plan"]
  object_id:
    type: string
  created_at:
    type: datetime
  status:
    type: enum
    allowed: ["draft", "reviewed"]
  task_ref:
    type: string
  covered_dimensions:
    type: array[string]
  missing_dimensions:
    type: array[string]
  blocking_for:
    type: object
    required: false
  summary:
    type: string
