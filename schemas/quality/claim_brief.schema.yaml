schema_id: "claim_brief.schema"
schema_version: "0.1.0"
object_type: "claim_brief"
title: "Claim Brief Schema"
description: "Readable claim boundary and report-readiness explanation."

required_fields:
  - schema_version
  - object_type
  - object_id
  - object_version
  - created_at
  - updated_at
  - status
  - metadata
  - topic_id
  - supported_claims
  - forbidden_claims
  - claim_ceiling
  - taste_grade
  - evidence_refs
  - summary

field_specs:
  schema_version:
    type: string
  object_type:
    type: enum
    allowed: ["claim_brief"]
  object_id:
    type: string
  object_version:
    type: string
  created_at:
    type: datetime
  updated_at:
    type: datetime
  status:
    type: enum
    allowed: ["active", "degraded", "archived"]
  metadata:
    type: object
  topic_id:
    type: string
  supported_claims:
    type: array[string]
  forbidden_claims:
    type: array[string]
  claim_ceiling:
    type: string
  taste_grade:
    type: string
  evidence_refs:
    type: array[string]
  summary:
    type: string
