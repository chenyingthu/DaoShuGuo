schema_id: "ablation_plan.schema"
schema_version: "0.1.0"
object_type: "ablation_plan"
title: "Ablation Plan Schema"
description: "Plan for separating skill, search-space, evaluator, and cognition effects."

required_fields:
  - schema_version
  - object_type
  - object_id
  - object_version
  - created_at
  - updated_at
  - status
  - metadata
  - task_ref
  - source_review_ref
  - hypothesis
  - controlled_variables
  - variants
  - required_metrics
  - claim_allowed_if_passed
  - claim_blocked_until_passed

field_specs:
  schema_version:
    type: string
  object_type:
    type: enum
    allowed: ["ablation_plan"]
  object_id:
    type: string
  object_version:
    type: string
  created_at:
    type: datetime
  updated_at:
    type: datetime
  status:
    type: enum
    allowed: ["draft", "ready", "completed", "archived"]
  metadata:
    type: object
  task_ref:
    type: string
  source_review_ref:
    type: string
  hypothesis:
    type: string
  controlled_variables:
    type: array[string]
  variants:
    type: array[string]
  required_metrics:
    type: array[string]
  claim_allowed_if_passed:
    type: array[string]
  claim_blocked_until_passed:
    type: array[string]
