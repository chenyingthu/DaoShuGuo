schema_id: "human_review.schema"
schema_version: "0.1.0"
object_type: "human_review"
title: "Human Review Schema"
description: "Expert review of an artifact or research decision point."

required_fields:
  - schema_version
  - object_type
  - object_id
  - object_version
  - created_at
  - updated_at
  - status
  - metadata
  - topic_id
  - task_id
  - created_by
  - source
  - target_refs
  - evidence_refs
  - review_target_ref
  - reviewer_role
  - decision
  - rationale
  - required_changes
  - claim_boundary

field_specs:
  schema_version:
    type: string
  object_type:
    type: enum
    allowed: ["human_review"]
  object_id:
    type: string
  object_version:
    type: string
  created_at:
    type: datetime
  updated_at:
    type: datetime
  status:
    type: enum
    allowed: ["draft", "active", "superseded", "resolved", "rejected"]
  metadata:
    type: object
  topic_id:
    type: string
  task_id:
    type: string
  created_by:
    type: string
  source:
    type: enum
    allowed: ["ui", "cli", "api", "agent_suggestion"]
  target_refs:
    type: array[string]
  evidence_refs:
    type: array[string]
  review_target_ref:
    type: string
  reviewer_role:
    type: string
  decision:
    type: enum
    allowed: ["approve", "revise", "reject", "pause"]
  rationale:
    type: string
  required_changes:
    type: array[string]
  claim_boundary:
    type: array[string]
