schema_id: "routing_constraint.schema"
schema_version: "0.1.0"
object_type: "routing_constraint"
title: "Routing Constraint Schema"
description: "Loop-readable constraint compiled from a human decision object."

required_fields:
  - schema_version
  - object_type
  - object_id
  - object_version
  - created_at
  - updated_at
  - status
  - metadata
  - topic_id
  - task_id
  - source_human_object_ref
  - applies_to_stage
  - constraint_type
  - content
  - priority
  - active
  - expires_after_iteration
  - conflicts_with
  - resolution_status

field_specs:
  schema_version:
    type: string
  object_type:
    type: enum
    allowed: ["routing_constraint"]
  object_id:
    type: string
  object_version:
    type: string
  created_at:
    type: datetime
  updated_at:
    type: datetime
  status:
    type: enum
    allowed: ["draft", "active", "superseded", "resolved", "rejected"]
  metadata:
    type: object
  topic_id:
    type: string
  task_id:
    type: string
  source_human_object_ref:
    type: string
  applies_to_stage:
    type: enum
    allowed: ["literature", "framing", "skill", "evaluation", "cognition", "delivery", "loop"]
  constraint_type:
    type: enum
    allowed: ["must_do", "must_not_do", "prefer", "require_evidence", "claim_limit", "pause_condition"]
  content:
    type: string
  priority:
    type: enum
    allowed: ["low", "medium", "high", "blocking"]
  active:
    type: boolean
  expires_after_iteration:
    type: integer
  conflicts_with:
    type: array[string]
  resolution_status:
    type: enum
    allowed: ["none", "resolved", "needs_human"]
