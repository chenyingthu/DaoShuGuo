schema_id: "novelty_assessment.schema"
schema_version: "0.1.0"
object_type: "novelty_assessment"
title: "Novelty Assessment Schema"
description: "用于表达当前技能或认知的新颖性、研究价值和继续投入优先级。"

required_fields:
  - schema_version
  - object_type
  - object_id
  - object_version
  - created_at
  - updated_at
  - status
  - metadata
  - task_ref
  - assessed_object_ref
  - novelty_level
  - research_value_level
  - summary

field_specs:
  schema_version:
    type: string
  object_type:
    type: enum
    allowed: ["novelty_assessment"]
  object_id:
    type: string
    pattern_hint: "novelty.<domain>.<problem_name>.<serial>"
  object_version:
    type: string
    pattern_hint: "major.minor.patch"
  created_at:
    type: datetime
  updated_at:
    type: datetime
  status:
    type: enum
    allowed: ["draft", "reviewed", "archived"]
  metadata:
    type: object
    required: true
  task_ref:
    type: string
  assessed_object_ref:
    type: string
  supporting_refs:
    type: array[string]
    required: false
  novelty_level:
    type: enum
    allowed: ["low", "medium", "high"]
  research_value_level:
    type: enum
    allowed: ["low", "medium", "high"]
  continue_investment:
    type: enum
    allowed: ["deprioritize", "observe", "continue", "prioritize"]
    required: false
  evidence_strength:
    type: enum
    allowed: ["low", "medium", "high"]
    required: false
  summary:
    type: string
  reasons:
    type: array[string]
    required: false

validation_rules:
  - rule_id: "novelty-assessment-object-required"
    description: "必须明确被评估对象。"
  - rule_id: "novelty-assessment-summary-required"
    description: "summary 不得为空。"
