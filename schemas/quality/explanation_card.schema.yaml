schema_id: "explanation_card.schema"
schema_version: "0.1.0"
object_type: "explanation_card"
title: "Explanation Card Schema"
description: "论文解释卡片对象，用于表达文献中的机制解释、边界和理论定位。"

required_fields:
  - schema_version
  - object_type
  - object_id
  - object_version
  - created_at
  - updated_at
  - status
  - metadata
  - paper_ref
  - explanation_summary

field_specs:
  schema_version:
    type: string
  object_type:
    type: enum
    allowed: ["explanation_card"]
  object_id:
    type: string
    pattern_hint: "explanation_card.<domain>.<paper_key>"
  object_version:
    type: string
  created_at:
    type: datetime
  updated_at:
    type: datetime
  status:
    type: enum
    allowed: ["draft", "reviewed", "archived"]
  metadata:
    type: object
    required: true
  paper_ref:
    type: string
  explanation_summary:
    type: string
  explanation_points:
    type: array[string]
    required: false
  scope_boundary:
    type: object
    required: false
  concept_tags:
    type: array[string]
    required: false
  excerpt_refs:
    type: array[string]
    required: false
  notes:
    type: array[string]
    required: false

validation_rules:
  - rule_id: "explanation-card-summary-required"
    description: "explanation_summary 不得为空。"
