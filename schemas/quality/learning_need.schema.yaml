schema_id: "learning_need.schema"
schema_version: "0.1.0"
object_type: "learning_need"
title: "Learning Need Schema"
description: "A cognition or review-gate request for external learning material."

required_fields:
  - schema_version
  - object_type
  - object_id
  - object_version
  - created_at
  - updated_at
  - status
  - metadata
  - task_ref
  - source_review_ref
  - observation_type
  - skill_dimension_focus
  - learning_questions
  - required_source_types
  - exclusion_criteria
  - success_criteria
  - claim_boundary

field_specs:
  schema_version:
    type: string
  object_type:
    type: enum
    allowed: ["learning_need"]
  object_id:
    type: string
  object_version:
    type: string
  created_at:
    type: datetime
  updated_at:
    type: datetime
  status:
    type: enum
    allowed: ["draft", "ready", "fulfilled", "archived"]
  metadata:
    type: object
  task_ref:
    type: string
  source_review_ref:
    type: string
  observation_type:
    type: enum
    allowed: ["skill_use_improvement", "skill_failure", "evaluator_gap", "cognition_gap", "task_mismatch"]
  skill_dimension_focus:
    type: array[string]
  learning_questions:
    type: array[string]
  required_source_types:
    type: array[string]
  exclusion_criteria:
    type: array[string]
  success_criteria:
    type: array[string]
  claim_boundary:
    type: array[string]
