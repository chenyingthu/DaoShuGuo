schema_id: "application_assessment.schema"
schema_version: "0.1.0"
object_type: "application_assessment"
title: "Application Assessment Schema"
description: "用于表达当前结果的应用相关性与边界。"
required_fields:
  - schema_version
  - object_type
  - object_id
  - created_at
  - status
  - task_ref
  - applicable_scenarios
  - not_applicable_scenarios
  - application_value
field_specs:
  schema_version:
    type: string
  object_type:
    type: enum
    allowed: ["application_assessment"]
  object_id:
    type: string
  created_at:
    type: datetime
  status:
    type: enum
    allowed: ["draft", "reviewed"]
  task_ref:
    type: string
  applicable_scenarios:
    type: array[string]
  not_applicable_scenarios:
    type: array[string]
  application_value:
    type: string
  limitations:
    type: array[string]
    required: false
