schema_id: "structural_skill_change_request.schema"
schema_version: "0.1.0"
object_type: "structural_skill_change_request"
title: "Structural Skill Change Request Schema"
description: "A skill-worker request targeting method/process/standard changes."

required_fields:
  - schema_version
  - object_type
  - object_id
  - object_version
  - created_at
  - updated_at
  - status
  - metadata
  - task_ref
  - diagnosis_ref
  - target_skill_ref
  - change_type
  - method_changes
  - process_changes
  - standard_changes
  - forbidden_usage_only_shortcuts
  - required_validation
  - claim_boundary

field_specs:
  schema_version:
    type: string
  object_type:
    type: enum
    allowed: ["structural_skill_change_request"]
  object_id:
    type: string
  object_version:
    type: string
  created_at:
    type: datetime
  updated_at:
    type: datetime
  status:
    type: enum
    allowed: ["draft", "ready", "completed", "archived"]
  metadata:
    type: object
  task_ref:
    type: string
  diagnosis_ref:
    type: string
  target_skill_ref:
    type: string
  change_type:
    type: enum
    allowed: ["method_change", "process_change", "standard_change", "mixed_structural_change", "skill_use_tuning"]
  method_changes:
    type: array[string]
  process_changes:
    type: array[string]
  standard_changes:
    type: array[string]
  forbidden_usage_only_shortcuts:
    type: array[string]
  required_validation:
    type: array[string]
  claim_boundary:
    type: array[string]
