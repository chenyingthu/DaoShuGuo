thresholds:
- claim_level: zhuoshi
  required_evidence:
  - A boundary-triggering scan must exist for baseline and candidate comparison.
  - A structural method, process, or standard change must be explicitly present, not
    only parameter escalation.
  - The non-uniform allocation candidate must be compared with uniform support under
    the same evaluator and comparable effort.
  - Primary hosting-capacity, secondary operational-quality, and control-effort metrics
    must all be reported.
  - The claim must remain static, voltage-driven, and control-strategy-conditioned
    with literature-framed boundaries.
  taste_ceiling: zhuoshi
forbidden_claims:
- Do not upgrade to zhuoshi without boundary-trigger and structural-change evidence.
- Do not treat secondary metric gain as hosting-capacity gain.
confidence: medium
gaps:
- Whether voltage-sensitivity-based allocation will actually move the hosting-capacity
  boundary under the current IEEE 69-bus snapshot is untested.
- Whether the existing scan envelope is sufficient after refinement to expose a stable
  transition region is unknown.
- Whether secondary loss or voltage-margin improvements persist under equal control-effort
  constraints is unknown.
- Whether the task package contains enough information to compute reliable voltage
  sensitivity without adding brittle task-specific assumptions is unknown.
- Thermal, time-series, and probabilistic hosting-capacity dimensions remain outside
  the current evidence base.
