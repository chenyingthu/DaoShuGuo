schema_version: "0.1.0"
task_ref: "task.power.ieee33_reactive_opt"
overlay_sources:
  - paper_ref_id: "paper.capacitor_tlbo_2014"
    source_key: "abstract"
    source_kind: "abstract_excerpt"
    method_notes:
      - "文献摘要强调在径向配电系统中，通过优化电容器的位置和容量来降低有功损耗并改善运行经济性。"
    explanation_notes:
      - "文献摘要将补偿配置视为改善损耗与电压质量的直接手段，而不是把调压边界当作主要控制对象。"
    explanation_point_notes:
      - "补偿位置与容量被共同优化，而不是只调单一边界电压。"
      - "改进路径直接依赖无功补偿设备配置。"
      - "该解释更接近 weak-shunt 一类技能的研究语义。"
    provenance_notes:
      - "基于公开摘要层信息整理的结构化摘要源。"
  - paper_ref_id: "paper.capacitor_tlbo_2014"
    source_key: "fulltext"
    source_kind: "fulltext_excerpt"
    method_notes:
      - "正文层材料强调通过直接优化电容器位置与容量，在径向配电系统中联合改善损耗、经济性与运行状态。"
    explanation_notes:
      - "正文层解释更明确地指出：性能改善来自补偿配置改变网络潮流分布，而不是经由边界调压间接实现。"
    explanation_point_notes:
      - "正文层把电容器位置与容量作为主要决策变量。"
      - "正文层说明改进机制来自补偿配置对潮流和损耗分布的直接影响。"
      - "这类解释与 weak-shunt 路线的研究语义高度一致。"
    provenance_notes:
      - "基于正文层人工摘录整理的结构化全文片段源。"
  - paper_ref_id: "paper.voltvar_fuzzy_2011"
    source_key: "abstract"
    source_kind: "abstract_excerpt"
    method_notes:
      - "文献摘要强调通过模糊优化协调 OLTC 与投切电容器，在不确定负荷和风速条件下优化电压与损耗。"
    explanation_notes:
      - "文献摘要将性能改进归因于多类调压资产的协调动作，因此更接近 Volt/Var control 控制语义。"
    explanation_point_notes:
      - "控制对象是调压设备与无功设备的协同行为。"
      - "优化目标包括电压质量和损耗，但依赖的是协调控制而非补偿配置本身。"
      - "该解释更适合作为 ext-grid/volt-var 路线的参照。"
    provenance_notes:
      - "基于公开摘要层信息整理的结构化摘要源。"
  - paper_ref_id: "paper.voltvar_fuzzy_2011"
    source_key: "fulltext"
    source_kind: "fulltext_excerpt"
    method_notes:
      - "正文层材料显示该方法通过模糊优化协调 ULTC 与投切电容器动作，在不确定条件下实现 Volt/Var 协同控制。"
    explanation_notes:
      - "正文层解释更明确地把性能提升归因于调压设备与无功设备的协调控制，而不是补偿配置本体。"
    explanation_point_notes:
      - "正文层将调压设备和无功设备的协同动作作为核心机制。"
      - "性能改进来源于协调控制，而不是节点补偿选址定容。"
      - "该解释更适合作为 ext-grid/volt-var 路线的高强度参照。"
    provenance_notes:
      - "基于正文层人工摘录整理的结构化全文片段源。"
