- The method treats capacitor placement and sizing as the main optimization variables
  in a radial distribution system.
- Teaching-learning based optimization is used to search candidate capacitor configurations.
explanation_notes: &id001
- Reactive compensation changes power-flow distribution and can reduce line losses.
- Capacitor location and size jointly affect voltage profile and economic performance.
- The mechanism is direct compensation placement, not boundary voltage tuning.
