relevance_notes: 代表性电容器配置/补偿优化工作，适合对齐 weak-shunt 路线。
method_notes:
- 正文层材料强调通过直接优化电容器位置与容量，在径向配电系统中联合改善损耗、经济性与运行状态。
explanation_notes:
- 正文层解释更明确地指出：性能改善来自补偿配置改变网络潮流分布，而不是经由边界调压间接实现。
explanation_point_notes:
- 正文层把电容器位置与容量作为主要决策变量。
- 正文层说明改进机制来自补偿配置对潮流和损耗分布的直接影响。
- 这类解释与 weak-shunt 路线的研究语义高度一致。
