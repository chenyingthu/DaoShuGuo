relevance_notes: 代表性电容器配置/补偿优化工作，适合对齐 weak-shunt 路线。
method_notes:
- 全文摘录层强调该方法以电容器配置为决策对象，直接处理径向配电系统中的无功补偿位置与容量优化。
explanation_notes:
- 全文摘录层将系统性能改善归因于无功补偿配置改变潮流分布、降低线路损耗并改善电压运行状态。
explanation_point_notes:
- 决策变量是补偿设备的位置与容量，而不是外部边界电压。
- 机制解释直接关联无功补偿、潮流分布、线路损耗和电压运行状态。
- 该解释对 weak-shunt 技能的研究语义构成高强度支持。
