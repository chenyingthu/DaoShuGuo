relevance_notes: 用于解释 performance failure 不应直接否定 inverter reactive support 家族。
method_notes:
- 通过 DER/逆变器提供有限无功支撑，在满足设备边界下改善电压与损耗。
explanation_notes:
- 核心解释是：逆变器 reactive support 的效果依赖参数、边界和系统目标，局部失败并不等于方法方向无效。
explanation_point_notes:
- 逆变器无功支撑通常受能力边界和目标冲突影响。
- 性能表现对参数与控制策略敏感。
- 性能失败更可能是实现边界，而不必然是否定方法家族。
