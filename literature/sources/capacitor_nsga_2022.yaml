relevance_notes: 强调候选节点选择与电容容量配置，对齐弱节点 + shunt 搜索思路。
method_notes:
- 采用模糊逻辑筛选候选母线，再用 NSGA-II 优化固定和投切电容器的位置与容量。
explanation_notes:
- 核心解释是：先缩小候选节点，再做多目标补偿配置，有助于同时改善电压稳定性、损耗与经济性。
explanation_point_notes:
- 先用启发式规则缩小候选节点，再进入补偿配置优化。
- 多目标优化同时关注电压稳定性、损耗与经济性。
- 文献语义仍围绕补偿设备配置，而不是统一 Volt/Var 协调调度。
