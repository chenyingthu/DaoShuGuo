explanation_summary: 文献摘要将补偿配置视为改善损耗与电压质量的直接手段，而不是把调压边界当作主要控制对象。
explanation_points:
- 补偿位置与容量被共同优化，而不是只调单一边界电压。
- 改进路径直接依赖无功补偿设备配置。
- 该解释更接近 weak-shunt 一类技能的研究语义。
