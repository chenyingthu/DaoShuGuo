explanation_summary: 正文层解释更明确地指出：性能改善来自补偿配置改变网络潮流分布，而不是经由边界调压间接实现。
explanation_points:
- 正文层把电容器位置与容量作为主要决策变量。
- 正文层说明改进机制来自补偿配置对潮流和损耗分布的直接影响。
- 这类解释与 weak-shunt 路线的研究语义高度一致。
