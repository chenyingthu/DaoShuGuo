explanation_summary: 文献摘要将性能改进归因于多类调压资产的协调动作，因此更接近 Volt/Var control 控制语义。
explanation_points:
- 控制对象是调压设备与无功设备的协同行为。
- 优化目标包括电压质量和损耗，但依赖的是协调控制而非补偿配置本身。
- 该解释更适合作为 ext-grid/volt-var 路线的参照。
