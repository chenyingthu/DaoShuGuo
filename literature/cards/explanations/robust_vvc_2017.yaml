explanation_summary: 核心解释是：通过鲁棒控制设计提升闭环稳定性和扰动抑制能力，从而维持期望电压性能。
explanation_points:
- 重点在不确定负荷和 DER 扰动下维持稳定的 Volt/Var 控制。
- 核心收益是扰动抑制和电压性能保持。
- 该语义更接近控制理论上的鲁棒调压，而不是补偿设备选址定容。
