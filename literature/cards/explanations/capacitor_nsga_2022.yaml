explanation_summary: 核心解释是：先缩小候选节点，再做多目标补偿配置，有助于同时改善电压稳定性、损耗与经济性。
explanation_points:
- 先用启发式规则缩小候选节点，再进入补偿配置优化。
- 多目标优化同时关注电压稳定性、损耗与经济性。
- 文献语义仍围绕补偿设备配置，而不是统一 Volt/Var 协调调度。
