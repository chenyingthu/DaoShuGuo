explanation_summary: 核心解释是：通过多类电压控制资产的协调调度，可以降低损耗并控制调节成本。
explanation_points:
- 文献显式协调电容器、OLTC、调压器和 prosumer DER 设定点。
- 目标函数同时兼顾损耗和调节成本。
- 问题表述侧重多资产 Volt/Var 协调，而不是候选补偿节点搜索。
