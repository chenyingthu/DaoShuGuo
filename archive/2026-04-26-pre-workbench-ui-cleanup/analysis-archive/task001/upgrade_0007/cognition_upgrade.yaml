decision: upgrade
rationale: 虽然 ext-grid 路线在当前指标上更强，但 weak-shunt 路线的控制变量和方法语义更接近无功优化问题本体，因此比较认知应从“谁更强”升级为“谁更值得继续演化”。
  当前种子文献对齐将其定位为 `variant`，支持将其视为值得继续投入的变体/潜在扩展。 解释对齐进一步提供了 19 条 excerpt 级证据，使该升级结论可回链到具体解释片段。
claim_adjustment: 应维持对 weak-shunt 当前性能的克制表述，但允许提高其研究价值判断。
