method_insights:
- The task003 iter02 gain is currently explained by broader inverter-Q search; a structural
  method change needs an explicit control-policy principle.
- A method-level candidate should explain how inverter reactive support is selected,
  not only enumerate more Q points.
process_insights:
- Candidate generation, evaluation, ablation, and claim review should be separate
  steps with separate artifacts.
- The loop should create a structural request only after learning material is reviewed.
standard_insights:
- Structural claims require fixed-budget comparison against metric-only tuning.
- Evaluation should include cost, robustness, and single-condition boundary checks
  before claiming generality.
applicability_boundaries:
- This MVP context is curated seed learning, not a complete literature survey.
- Insights apply to task003 single-representative-condition evidence only.
confidence: medium
gaps:
- Needs real external literature retrieval before high-confidence method claims.
- Needs ablation separating cognition-guided structure from metric-only tuning.
