harness_findings:
- Deterministic backend can validate contracts but not autonomous cognition.
- Pi GPT-5.5 has 5 verified full-loop artifact-chain run(s).
- Pi GPT-5.5 also has text and tool-call smoke evidence.
- Codex/OMX remains the engineering orchestrator unless a backend dispatch layer is
  added.
recommended_backend_policy:
- Use deterministic backend as regression baseline.
- Use Pi GPT-5.5 for the next bounded multi-class agentic loop expansion.
- Do not claim backend-robust full-loop validation until Pi and Codex/OMX both pass
  full-loop checks.
not_proven:
- Pi GPT-5.5 full-loop validation is still fixture-level and not yet research-quality
  Level 5.
- Codex/OMX backend full-loop validation is not proven yet.
- Cross-backend semantic agreement is not proven yet.
summary: Compared 6 agent runtime profiles.
