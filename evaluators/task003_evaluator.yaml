baseline_strategy:
  type: "named_baseline"
  refs:
    - "baseline.power.ieee69_renewable_reactive_opt.fixed_inverter_q"
pass_criteria:
  rule: "关键指标优于基线、无新增约束违反，并记录 reactive_support_effort"
execution_entry:
  type: "python_script"
  path: "evaluators/task003_evaluator.py"
comparison_mode: "baseline_and_constraint"
stability_checks:
  - "单代表工况验证"
