  - "记录 boundary trigger 与 control effort，防止次级指标或高代价伪进步"
blind_spots:
  - "不覆盖时序承载力"
  - "不覆盖经济约束"
  - "不覆盖多控制对象协调"
evidence_outputs:
  - "boundary_metrics"
  - "violation_trigger"
  - "boundary_trigger_scale"
  - "control_effort"
