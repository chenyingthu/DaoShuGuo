metric_definitions:
  - metric_id: "hosting_capacity_level"
    direction: "higher_is_better"
    description: "给定控制策略下的最大允许接入水平"
  - metric_id: "violation_trigger_type"
    direction: "target_is_best"
    description: "边界触发类型"
  - metric_id: "loss_at_boundary"
    direction: "lower_is_better"
    description: "边界点损耗"
  - metric_id: "voltage_margin"
    direction: "higher_is_better"
    description: "边界点电压裕度"
  - metric_id: "boundary_trigger_scale"
    direction: "higher_is_better"
    description: "首次触发约束或边界确认的接入水平"
  - metric_id: "first_violation_type"
    direction: "target_is_best"
    description: "首次边界触发类型，用于判断扫描是否真正触达边界"
  - metric_id: "control_effort"
    direction: "lower_is_better"
    description: "候选控制策略使用的无功支撑代价"
baseline_strategy:
  type: "named_baseline"
  refs:
    - "baseline.power.ieee69_hosting_capacity.fixed_inverter_q_capacity_scan"
pass_criteria:
